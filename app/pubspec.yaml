name: rekindle_app
description: "Rekindle - A calm, offline rediscovery mobile app."
publish_to: 'none'

version: 0.2.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  rekindle_core:
    path: ../packages/rekindle_core

  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  shared_preferences: ^2.2.3
  flutter_local_notifications: ^17.2.1
  timezone: ^0.9.3
  flutter_timezone: ^3.0.1
  fl_chart: ^0.68.0
  share_plus: ^10.0.0
  clock: ^1.1.1
  uuid: ^4.4.0
  path: ^1.9.0
  intl: any
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/catalog/interests.json
    - assets/copy/nudge_copy_en.json
