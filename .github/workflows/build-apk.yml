name: Build Android APK & Offline Guard

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Test, Guard & Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Dart
        run: |
          flutter --version
          dart --version

      - name: Test rekindle_core package
        run: |
          cd packages/rekindle_core
          dart pub get
          dart test
          cd ../..

      - name: Test app & run flutter analyze
        run: |
          cd app
          flutter pub get
          flutter analyze
          flutter test
          cd ..

      - name: Run Rekindle Offline & Copy Guard
        run: |
          dart run tool/check_offline.dart

      - name: Build Android Release APK
        run: |
          cd app
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rekindle-release-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Publish to GitHub Releases
        if: (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main') && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && format('Rekindle {0}', github.ref_name) || 'Rekindle Latest Development Build' }}
          files: app/build/app/outputs/flutter-apk/app-release.apk
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          generate_release_notes: true

      - name: Send Telegram Notification with APK
        if: (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main') && github.event_name != 'pull_request'
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          TAG="${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}"
          RAW_COMMIT="${{ github.event.head_commit.message }}"
          SAFE_COMMIT=$(echo "$RAW_COMMIT" | head -n 1 | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${TAG}"
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/app-release.apk"

          CAPTION="🚀 <b>Rekindle APK Build Available</b>"$'\n\n'
          CAPTION+="<b>Commit:</b> ${SAFE_COMMIT}"$'\n'
          CAPTION+="<b>Version/Tag:</b> <code>${TAG}</code> (${SHORT_SHA})"$'\n\n'
          CAPTION+="📦 <i>Download and install directly from the attached file or GitHub Release.</i>"$'\n\n'
          CAPTION+="🔗 <a href=\"${RELEASE_URL}\">View GitHub Release</a> | <a href=\"${DOWNLOAD_URL}\">Direct APK Download</a>"

          echo "Sending APK document to Telegram..."
          if ! curl --fail-with-body --silent --show-error \
            --request POST \
            "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument" \
            -F "chat_id=${CHAT_ID}" \
            -F "document=@app/build/app/outputs/flutter-apk/app-release.apk" \
            -F "caption=${CAPTION}" \
            -F "parse_mode=HTML"; then
            echo "sendDocument failed, falling back to sendMessage..."
            curl --fail-with-body --silent --show-error \
              --request POST \
              "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${CHAT_ID}" \
              --data-urlencode "text=${CAPTION}" \
              --data-urlencode "parse_mode=HTML"
          fi
