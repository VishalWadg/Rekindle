name: Build Android APK & Offline Guard

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Test, Guard & Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Dart
        run: |
          flutter --version
          dart --version

      - name: Verify or Install Android NDK
        run: |
          if [ -d "$ANDROID_HOME/ndk/27.0.12077973" ]; then
            echo "NDK 27.0.12077973 is pre-installed."
          else
            echo "Installing NDK 27.0.12077973 via sdkmanager..."
            yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.0.12077973"
          fi

      - name: Test rekindle_core package
        run: |
          cd packages/rekindle_core
          dart pub get
          dart test
          cd ../..

      - name: Test app & run flutter analyze
        run: |
          cd app
          flutter pub get
          flutter analyze
          flutter test
          cd ..

      - name: Run Rekindle Offline & Copy Guard
        run: |
          dart run tool/check_offline.dart

      - name: Build Android Release APK
        env:
          ANDROID_NDK_ROOT: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
        run: |
          cd app
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rekindle-release-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
