name: rekindle_core
description: Pure Dart core engine for Rekindle (offline SQLite, bandit, governor, planner, analytics).
version: 0.2.0
publish_to: none

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  drift: ^2.20.0
  sqlite3: ^2.4.6
  uuid: ^4.4.0
  clock: ^1.1.1
  meta: ^1.15.0

dev_dependencies:
  drift_dev: ^2.20.0
  build_runner: ^2.4.9
  test: ^1.25.0
